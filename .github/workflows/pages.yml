name: Publicar ferramentas no GitHub Pages

# Publica as páginas estáticas das pastas `tools/` (ex.: explorador do MapBiomas Solo Col. 3)
# em https://mapbiomas.github.io/brazil-soil/, mantendo o caminho do repositório.

on:
  push:
    branches: [main]
    paths:
      - "soil_30m_landsat/**/tools/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site só com as pastas tools/
        run: |
          mkdir -p _site
          find soil_30m_landsat -type d -name tools -prune | while read -r d; do
            mkdir -p "_site/$d"
            cp -r "$d/." "_site/$d/"
          done
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="pt-BR"><head><meta charset="utf-8"><title>MapBiomas Solo · Ferramentas</title></head>
          <body><h1>MapBiomas Solo · Ferramentas</h1>
          <ul><li><a href="soil_30m_landsat/collection_03beta/tools/explorador_mapbiomas_solo/">Explorador da Coleção 3</a></li></ul>
          </body></html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
